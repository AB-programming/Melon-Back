redis:
  host: 127.0.0.1
  port: 6379
  maxTotal: 30 # 最大连接数
  maxIdle: 20 # 最大空闲连接数
  database: 3 # 所选数据库

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/melon?useSSL=false&useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 12345678

hdfs:
  uri: hdfs://localhost:9800
  user: AB-style

file:
  maxFileSize: 1024
  maxRequestSize: 2048