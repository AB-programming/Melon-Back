spring:
  cloud:
    nacos:
      config:
        server-addr: localhost:8848
        prefix: gateway-service
        file-extension: yml
    gateway:
      mvc:
        routes:
          - id: baseService
            uri: lb://baseService
            predicates:
              - Path=/nihao/**, /hello
            filters:
              - RewritePath=/nihao, /
          - id: userService
            uri: lb://userService
            predicates:
              - Path=/user/**
            filters:
              - RewritePath=/user, /
          - id: authorizationService
            uri: lb://authorizationService
            predicates:
              - Path=/oauth2/authorize, /oauth2/token, /oauth2/consent, /introspect, /logout, /login
          - id: videoService
            uri: lb://videoService
            predicates:
              - Path=/video/**
            filters:
              - RewritePath=/video, /
          - id: postService
            uri: lb://postService
            predicates:
              - Path=/post/**
            filters:
              - RewritePath=/post, /